# Développement : Next.js, Express et Gateway en mode dev — `docker compose -f docker-compose.dev.yml up --build`
services:
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile.dev
    container_name: pocket-maps-gateway-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - SERVER_URL=http://server:4000
      - CLIENT_URL=http://client:3001
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile.dev
    container_name: pocket-maps-client-dev
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/client/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.dev
    container_name: pocket-maps-server-dev
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    restart: unless-stopped
