# Développement : Next.js en mode dev avec rechargement — `docker compose -f docker-compose.dev.yml up --build`
services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: flipper-website-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - .:/app
      - next_dev_node_modules:/app/node_modules
      - next_dev_next:/app/.next
    restart: unless-stopped

volumes:
  next_dev_node_modules:
  next_dev_next:
