# Architecture de Production Monorepo Pocket Maps
services:
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: pocket-maps-gateway
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - client
      - server
    restart: always

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: pocket-maps-client
    # Port interne 3001, mais masqué par la gateway (non exposé vers l'extérieur sauf besoin)
    expose:
      - "3001"
    env_file: .env
    environment:
      - NODE_ENV=production
      - CLIENT_URL=http://client:3001
      - SERVER_URL=http://server:4000
    restart: always

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: pocket-maps-server
    expose:
      - "4000"
    env_file: .env
    environment:
      - NODE_ENV=production
    restart: always
