# Architecture de Production Monorepo Pocket Maps
services:
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: pocket-maps-gateway
    ports:
      - "127.0.0.1:8881:8881"
    env_file: .env
    environment:
      - CLIENT_URL=http://client:8888
      - SERVER_URL=http://server:8882
    depends_on:
      - client
      - server
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.flippix-app.rule=Host(`app.flippix.dev.azhao.fr`)"
      - "traefik.http.routers.flippix-app.entrypoints=websecure"
      - "traefik.http.routers.flippix-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.flippix-app.loadbalancer.server.port=8881"
    restart: always

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL}
    container_name: pocket-maps-client
    expose:
      - "8888"
    env_file: .env
    environment:
      - NODE_ENV=production
      - CLIENT_URL=http://client:8888
      - SERVER_URL=http://server:8882
    networks:
      - default
    labels:
      - "traefik.enable=false"
    restart: always

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: pocket-maps-server
    ports:
      - "127.0.0.1:8882:8882"
    env_file: .env
    environment:
      - NODE_ENV=production
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.flippix-api.rule=Host(`api.flippix.dev.azhao.fr`)"
      - "traefik.http.routers.flippix-api.entrypoints=websecure"
      - "traefik.http.routers.flippix-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.flippix-api.loadbalancer.server.port=8882"
    restart: always

networks:
  default:
  web:
    external: true
