# Reverse proxy nginx — production Flippix
# 2 sous-domaines : app.* -> gateway (8881), api.* -> server (8882)
#
# Déploiement VPS :
#   sudo cp deploy/nginx/flippix.dev.azhao.fr.conf /etc/nginx/sites-available/flippix.conf
#   sudo ln -sf /etc/nginx/sites-available/flippix.conf /etc/nginx/sites-enabled/flippix.conf
#   sudo certbot certonly --nginx -d app.flippix.dev.azhao.fr -d api.flippix.dev.azhao.fr
#   sudo nginx -t && sudo systemctl reload nginx

# --- Redirection HTTP -> HTTPS ---
server {
    listen 80;
    server_name app.flippix.dev.azhao.fr api.flippix.dev.azhao.fr;
    return 301 https://$host$request_uri;
}

# --- app.* -> gateway (Next.js client + /api + /v1 via la gateway) ---
server {
    listen 443 ssl;
    server_name app.flippix.dev.azhao.fr;

    ssl_certificate     /etc/letsencrypt/live/app.flippix.dev.azhao.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.flippix.dev.azhao.fr/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8881;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# --- api.* -> server Express direct (8882) ---
server {
    listen 443 ssl;
    server_name api.flippix.dev.azhao.fr;

    ssl_certificate     /etc/letsencrypt/live/api.flippix.dev.azhao.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.flippix.dev.azhao.fr/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8882;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
