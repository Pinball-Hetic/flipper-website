name: CI/CD Pipeline

on:
  push:
    branches:
      - Production
      - Dev
  pull_request:
    branches:
      - Production
      - Dev

env:
  REGISTRY: ghcr.io
  # On force le nom de l'image en minuscules ici pour éviter l'erreur Docker
  IMAGE_NAME: pinball-hetic/flipper-website

jobs:
  # lint-and-test:
  #   name: 🧪 Lint & Checks
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: '20'
  #         cache: 'npm'
  #     - name: Install dependencies
  #       run: npm ci || npm install
  #     - name: Run Linter
  #       run: npm run lint

  build-and-push:
    name: 🐳 Build & Push Docker Image
    # needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/Production' || github.ref == 'refs/heads/Dev')
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Environment Variables
        id: vars
        run: |
          if [ "${{ github.ref }}" = "refs/heads/Production" ]; then
            echo "TAG=latest" >> $GITHUB_OUTPUT
          else
            echo "TAG=dev" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.TAG }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy to Production Server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/Production'
    
    steps:
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            export DEPLOY_PATH="/srv/flipper-website"
            
            echo "--- Dossier $DEPLOY_PATH ---"
            cd "$DEPLOY_PATH" || exit 1
            
            echo "--- Login ---"
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            echo "--- Pull ---"
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            echo "--- Restart ---"
            if [ -f "docker-compose.yml" ]; then
              # Utilisation de 'docker compose' au lieu de 'docker-compose'
              docker compose down
              docker compose up -d
            else
              echo "ERREUR : docker-compose.yml absent"
              exit 1
            fi
            
            docker image prune -f --filter "until=24h"
